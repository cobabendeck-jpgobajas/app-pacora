name: app_pacora
description: >
  App movil (Android, version minima viable) para predecir la dosis optima
  de sulfato de aluminio a partir de una foto de la muestra de agua.
  Aguas Manantiales de Pacora S.A. E.S.P. - Fase 4 del Plan de Ejecucion.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Cliente HTTP para hablar con la API del backend (Fase 3)
  http: ^1.2.2

  # Captura guiada: camara o galeria
  image_picker: ^1.1.2

  # Deteccion de conectividad, para la cola offline
  connectivity_plus: ^6.1.0

  # Persistencia local (cola offline + historial) y ubicacion de archivos
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Configuracion (URL del backend) y formato de fechas
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
