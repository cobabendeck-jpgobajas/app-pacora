name: Build APK (App Pácora)
 
# Compila el APK de Android en un runner de GitHub (Ubuntu), sin que el
# usuario necesite instalar Flutter/Android SDK en su propia maquina.
# Se dispara automaticamente al hacer push a main, o manualmente desde la
# pestana "Actions" del repositorio (boton "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4
 
      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
 
      - name: Crear el proyecto Flutter base e incorporar el codigo de la app
        run: |
          flutter create --platforms=android --org com.pacora scaffold
          rm -rf scaffold/lib
          cp -r mobile_app/lib scaffold/lib
          cp mobile_app/pubspec.yaml scaffold/pubspec.yaml
          # Agrega el permiso de camara (el de INTERNET ya viene en la
          # plantilla de "flutter create") justo antes de <application ...>
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' scaffold/android/app/src/main/AndroidManifest.xml
 
      - name: Configurar la firma estable del release (keystore de produccion)
        working-directory: scaffold
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          # 1) Restaurar el keystore (guardado como secreto en base64) dentro del modulo android/app
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
 
          # 2) Generar android/key.properties con las credenciales (nunca se versiona en el repo)
          cat > android/key.properties <<EOF
          storePassword=$SIGNING_STORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
 
          # 3) Parchear android/app/build.gradle.kts para firmar el release con esta llave
          #    (en vez de la llave de debug que Flutter usa por defecto)
          python3 - <<'PY'
          path = "android/app/build.gradle.kts"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
 
          assert "keystoreProperties" not in content, (
              "build.gradle.kts ya contiene una configuracion de firma; revisar manualmente "
              "antes de continuar (posible cambio de plantilla de Flutter)."
          )
 
          header = (
              "import java.util.Properties\n"
              "import java.io.FileInputStream\n\n"
              "val keystoreProperties = Properties()\n"
              "val keystorePropertiesFile = rootProject.file(\"key.properties\")\n"
              "if (keystorePropertiesFile.exists()) {\n"
              "    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
              "}\n\n"
          )
          content = header + content
 
          signing_block = (
              "    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            keyAlias = keystoreProperties[\"keyAlias\"] as String\n"
              "            keyPassword = keystoreProperties[\"keyPassword\"] as String\n"
              "            storeFile = keystoreProperties[\"storeFile\"]?.let { file(it) }\n"
              "            storePassword = keystoreProperties[\"storePassword\"] as String\n"
              "        }\n"
              "    }\n\n"
          )
          anchor = "    defaultConfig {"
          assert content.count(anchor) == 1, (
              "No se encontro exactamente una vez 'defaultConfig {' en build.gradle.kts; "
              "revisar manualmente (posible cambio de plantilla de Flutter)."
          )
          content = content.replace(anchor, signing_block + anchor, 1)
 
          old_signing = 'signingConfig = signingConfigs.getByName("debug")'
          assert content.count(old_signing) == 1, (
              "No se encontro exactamente una vez la firma de debug en build.gradle.kts; "
              "revisar manualmente (posible cambio de plantilla de Flutter)."
          )
          content = content.replace(
              old_signing, 'signingConfig = signingConfigs.getByName("release")', 1
          )
 
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
 
          print("build.gradle.kts actualizado correctamente con la firma de release.")
          PY
 
      - name: Instalar dependencias del proyecto
        working-directory: scaffold
        run: flutter pub get
 
      - name: Compilar APK (release)
        working-directory: scaffold
        run: flutter build apk --release
 
      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-pacora-release-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
